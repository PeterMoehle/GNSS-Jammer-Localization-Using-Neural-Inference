[project]
name = "gnss-jammer-localization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy==1.23.5",
    "pandas==1.5.2",
    "pytorch-lightning>=2.6.6",
    "torch",
    "torch-geometric==2.5.3",
    "tqdm==4.65.0",
    "typeshed-client>=2.14.0",
    "yacs>=0.1.8",
]

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
