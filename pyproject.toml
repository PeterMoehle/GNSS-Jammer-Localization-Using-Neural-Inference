[project]
name = "gnss-jammer-localization"
version = "0.1.0"
description = "Research project for GNSS jammer localization (building on arXiv:2506.03196)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy",
    "pytorch-lightning>=2.6.6",
    "torch",
    "torch-geometric==2.8.1",
    "tqdm==4.70.1",
    "typeshed-client>=2.14.0",
    "yacs>=0.1.8",
    "boto3>=1.43.114",
    "deepmimo>=4.0.5",
    "h5py>=3.16.0",
    "mapbox-earcut>=2.1.0",
    "omegaconf>=2.4.0",
    "open3d>=0.20.0",
    "osmium>=4.3.1",
    "osmnx>=2.1.1",
    "plotly>=7.1.0",
    "polyscope>=2.6.1",
    "pydeck>=0.9.3",
    "pyvista>=0.49.1",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "sionna-rt>=2.2.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "triangle>=20250106",
    "trimesh>=5.1.1",
    "utm>=0.9.0",
    "viser>=1.1.1",
    "ipykernel>=7.4.0",
    "torchinfo>=1.8.0",
    "pydantic-settings>=2.16.3",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

